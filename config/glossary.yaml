# =========================================================
# AI用語集
# ---------------------------------------------------------
# サイト右側に表示する用語集です。難しい言葉が出てきたときに
# ここで意味を確認できるようにする、という目的だけのファイルです。
# 新しい用語が出てきたら、ここに追記していけば育っていきます。
# =========================================================

terms:
  - term: "コパイロット(Copilot)"
    definition: "AIが隣についていて、作業のたびに提案や下書きをしてくれる機能・製品のこと。Microsoft・GitHubなどが同じ名前で製品を出している。"
  - term: "LLM(大規模言語モデル)"
    definition: "ChatGPTやClaudeのような、文章を理解して書けるAIの土台となる技術。"
  - term: "エージェント"
    definition: "指示を一度出すと、複数の作業を自分で判断しながら最後までやってくれるAIの形態。"
  - term: "RAG(検索拡張生成)"
    definition: "AIが答える前に、手元の資料やデータを検索してから回答する仕組み。社内資料に基づいた回答をさせたいときに使う。"
  - term: "ファインチューニング"
    definition: "汎用のAIモデルに追加の学習をさせて、特定の用途・話し方に寄せる作業のこと。"
  - term: "プロンプト"
    definition: "AIに対して出す指示文・質問文のこと。書き方次第で出てくる答えの質が変わる。"
  - term: "トークン"
    definition: "AIが文章を処理するときの最小単位。AIの利用料金はこのトークン数に応じて決まることが多い。"
  - term: "ハルシネーション"
    definition: "AIが、もっともらしいけれど事実と違うことを答えてしまう現象。"
  - term: "マルチモーダル"
    definition: "文章だけでなく、画像・音声・動画なども扱える(組み合わせられる)AIのこと。"
  - term: "API"
    definition: "自分のサービスやツールから、他社のAIやシステムの機能を呼び出すための接続窓口。"
  - term: "推論(インファレンス)"
    definition: "学習済みのAIが、実際に質問や指示を受けて答えを出す処理のこと。"
  - term: "オープンソース(AIモデル)"
    definition: "誰でも中身を見たり自分のサーバーで動かしたりできる形で公開されているAIモデルのこと。"
  - term: "Physical AI"
    definition: "ロボットなど、現実の物理世界で動く機械を制御するためのAI技術のこと。"
  - term: "SaaS"
    definition: "インストール不要で、ブラウザからそのまま使えるように提供されるソフトウェアのこと。Miyaviもこの形態。"
