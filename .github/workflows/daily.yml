name: daily-news-pick

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00(日本時間)
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-pick
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 収集・要約・安全チェック・サイト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: データをコミット(過去ログを蓄積)
        run: |
          git config user.name "news-pick-bot"
          git config user.email "news-pick-bot@users.noreply.github.com"
          git add data
          git commit -m "daily pick $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
